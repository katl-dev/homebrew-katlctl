name: Test katlctl formulas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          core: false
          cask: false
      - name: Install and test beta channel
        run: |
          brew install katl-dev/katlctl/beta
          katlctl version
          brew test katl-dev/katlctl/beta
      - name: Install and test exact beta release
        run: |
          version="$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/beta.rb)"
          brew uninstall katl-dev/katlctl/beta
          brew install "katl-dev/katlctl/beta@$version"
          katlctl version
          brew test "katl-dev/katlctl/beta@$version"
      - name: Install and test stable channel
        if: hashFiles('Formula/stable.rb') != ''
        run: |
          version="$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/beta.rb)"
          brew uninstall "katl-dev/katlctl/beta@$version"
          brew install katl-dev/katlctl/stable
          katlctl version
          brew test katl-dev/katlctl/stable
